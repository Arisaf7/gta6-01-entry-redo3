<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>SOLMARA — Streets of the Sun</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #1d2b1f;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8, 12, 10, 0.55);
    z-index: 10;
  }
  .panel {
    max-width: 620px;
    width: calc(100vw - 48px);
    background: linear-gradient(160deg, #2b2118, #171310 70%);
    border: 2px solid #ffb703;
    border-radius: 16px;
    padding: 28px 32px;
    color: #fff3d6;
    text-align: center;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
  }
  .panel h1 {
    margin: 0;
    font-size: 58px;
    letter-spacing: 6px;
    color: #ffb703;
    text-shadow: 0 3px 0 #7a4a21, 0 6px 18px rgba(0, 0, 0, 0.5);
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 30px;
    color: #ffb703;
  }
  .tagline {
    margin: 2px 0 14px;
    font-size: 20px;
    letter-spacing: 4px;
    color: #7ec8e3;
    text-transform: uppercase;
  }
  .story { font-size: 16px; line-height: 1.55; margin: 10px 0; }
  .brief { font-size: 16px; line-height: 1.6; font-style: italic; margin: 12px 0; }
  .objective { font-size: 16px; font-weight: 700; color: #ffd166; margin: 10px 0; }
  .reward { font-size: 15px; color: #9be28a; margin: 6px 0 16px; }
  .save-line { font-size: 14px; color: #c9b896; margin: 10px 0; }
  .controls { font-size: 13px; color: #b8a88f; margin: 14px 0 0; line-height: 1.5; }
  .fine { font-size: 12px; color: #8f8071; margin: 10px 0 0; }
  .panel button {
    display: block;
    margin: 10px auto 0;
    min-width: 240px;
    padding: 12px 22px;
    font-size: 18px;
    font-weight: 700;
    color: #171310;
    background: #ffb703;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .panel button:hover { background: #ffd166; }
  #status {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"></div>
<div id="status" aria-hidden="true"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
